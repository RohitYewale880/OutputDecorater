                <mat-card-content>
                    <app-todoform-comp (emitarray)="getObjtoadd($event)"></app-todoform-comp>
                </mat-card-content>
            </mat-card>
        </div>
        <div class="col-md-6">
            <mat-card class="example-card">
                <mat-card-content>
                    <app-todolist-comp 
                    (emitobjtoparent)="checkedObj($event)"

                </mat-card-content>
            </mat-card>
            
        </div>
    </div>
</div>
