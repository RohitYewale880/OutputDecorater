<ul class="list-group">
    <li *ngFor="let todo of gettodoarr; trackBy:trackByfun" 
    [ngClass]="{
        'completedTask' : todo.isComplete
        }"
    class="list-group-item d-flex justify-content-between">
        <div class="d-flex align-items-center">
            <mat-checkbox [checked]="todo.isComplete" 
            (change)="isCheckChange($event, todo)"
            class="mr-3 align-self-center">
            </mat-checkbox>
            <strong>{{todo.todoItem}}</strong>
        </div>
        <div>
            <button mat-mini-fab color="primary" class="mr-3">
                <mat-icon>edit</mat-icon>
            </button>

            <button mat-mini-fab color="warn">
                <mat-icon>delete</mat-icon>
            </button>
        </div>
    </li>
</ul>
